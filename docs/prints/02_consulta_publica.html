<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Solicitação por Protocolo • Sistema de Impressões</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1e40af;
            --secondary-bg: #f8fafc;
        }
        body {
            background-color: var(--secondary-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .navbar-brand-custom {
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff !important;
        }
        .main-content {
            flex: 1 0 auto;
        }
        .footer-custom {
            flex-shrink: 0;
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
        }
        .badge-recebida { background-color: #0284c7; color: #fff; }
        .badge-em-andamento { background-color: #f59e0b; color: #000; }
        .badge-aguardando-correcao { background-color: #ef4444; color: #fff; }
        .badge-concluida { background-color: #10b981; color: #fff; }
        .badge-cancelada { background-color: #64748b; color: #fff; }
        .card-custom {
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
    </style>
    
</head>
<body>
    <!-- Navbar Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: var(--primary-color);">
        <div class="container">
            <a class="navbar-brand navbar-brand-custom d-flex align-items-center gap-2" href="/">
                <i class="bi bi-printer-fill fs-4 text-info"></i>
                <span>Portal de Impressões</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMain">
                
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="btn btn-light btn-sm fw-semibold" href="/login/">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                        </a>
                    </li>
                </ul>
                
            </div>
        </div>
    </nav>

    <!-- Mensagens de Feedback (Alerts) -->
    <div class="container mt-3">
        
    </div>

    <!-- Conteúdo Principal -->
    <main class="main-content py-4">
        
<div class="container">
    <div class="row justify-content-center mb-4">
        <div class="col-12 col-md-8 col-lg-6 text-center">
            <h3 class="fw-bold mb-2 text-dark">Consulta de Solicitação</h3>
            <p class="text-muted small mb-4">Digite o código de protocolo do seu pedido para acompanhar o andamento e a situação em tempo real.</p>
            
            <form method="get" action="/consulta/" class="card card-custom p-2 bg-white shadow-sm mb-4">
                <div class="input-group">
                    <span class="input-group-text bg-white border-0 text-muted"><i class="bi bi-search"></i></span>
                    <input type="text" name="protocolo" class="form-control border-0 font-monospace text-uppercase" placeholder="Ex: IMP-202611-XXXX" value="" required autofocus>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold" style="background-color: var(--primary-color);">
                        Consultar
                    </button>
                </div>
            </form>
        </div>
    </div>

    
</div>

    </main>

    <!-- Rodapé -->
    <footer class="footer-custom py-3 mt-auto">
        <div class="container text-center text-muted small">
            <div><strong>Sistema de Solicitação e Gestão de Impressões</strong> • Projeto Integrador</div>
            <div class="text-secondary" style="font-size: 0.75rem;">Fila de Atendimento FIFO • Desenvolvimento Web com Python e Django</div>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
</body>
</html>
